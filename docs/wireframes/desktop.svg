<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="5480" viewBox="0 0 1440 5480">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#d8d8d8" stroke-width="1"/>
    </pattern>
    <style>
      .bg { fill: #f5f5f2; }
      .paper { fill: #fff; }
      .ink { fill: #171717; }
      .muted { fill: #6b6b6b; }
      .line { stroke: #171717; stroke-width: 2; fill: none; }
      .thin { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .dash { stroke: #777; stroke-width: 2; stroke-dasharray: 10 8; fill: none; }
      .media { fill: #d8d8d5; stroke: #171717; stroke-width: 2; }
      .panel { fill: #fff; stroke: #171717; stroke-width: 2; }
      .soft { fill: #e9e9e6; }
      .label { font: 700 16px Arial, sans-serif; letter-spacing: 1.8px; fill: #171717; }
      .small { font: 14px Arial, sans-serif; fill: #555; }
      .body { font: 19px Arial, sans-serif; fill: #2a2a2a; }
      .h1 { font: 700 62px Arial, sans-serif; fill: #171717; }
      .h2 { font: 700 42px Arial, sans-serif; fill: #171717; }
      .h3 { font: 700 28px Arial, sans-serif; fill: #171717; }
      .note { font: 15px Arial, sans-serif; fill: #555; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="5480"/>

  <!-- Hero -->
  <rect class="media" x="0" y="0" width="1440" height="900"/>
  <line class="thin" x1="0" y1="0" x2="1440" y2="900"/>
  <line class="thin" x1="1440" y1="0" x2="0" y2="900"/>
  <rect x="0" y="0" width="1440" height="96" fill="#171717" opacity=".18"/>
  <text class="label" x="54" y="58" fill="#fff">2026 / 思い出マップ自主企画ゼミ</text>
  <text class="small" x="1120" y="58" fill="#fff">活動記録　　制作物　　振り返り</text>
  <rect x="48" y="688" width="630" height="150" fill="#fff" opacity=".92"/>
  <text class="label" x="76" y="725">HOME COMING DAY / 2026.06.20</text>
  <text class="h3" x="76" y="773">卒業生の思い出を集め、</text>
  <text class="h3" x="76" y="808">古地図とデジタル地図に表示した。</text>
  <rect class="panel" x="1126" y="758" width="250" height="56"/>
  <text class="label" x="1160" y="793">活動を時系列で見る ↓</text>
  <text class="small" x="48" y="875">全画面の実写映像または会場写真 / 文章はこの一文だけ</text>

  <!-- Overview -->
  <rect class="paper" x="0" y="900" width="1440" height="520"/>
  <text class="label" x="80" y="990">00 / OVERVIEW</text>
  <text class="h2" x="80" y="1065">何をつくったゼミか</text>
  <text class="body" x="80" y="1120">展示の概要を、抽象的なコピーではなく短い事実で説明する。</text>
  <rect class="panel" x="760" y="978" width="600" height="330"/>
  <line class="thin" x1="760" y1="1060" x2="1360" y2="1060"/>
  <line class="thin" x1="760" y1="1142" x2="1360" y2="1142"/>
  <line class="thin" x1="760" y1="1224" x2="1360" y2="1224"/>
  <line class="thin" x1="950" y1="978" x2="950" y2="1308"/>
  <text class="label" x="790" y="1028">期間</text>
  <text class="body" x="980" y="1028">2026年4月—</text>
  <text class="label" x="790" y="1110">本番</text>
  <text class="body" x="980" y="1110">Home Coming Day</text>
  <text class="label" x="790" y="1192">制作</text>
  <text class="body" x="980" y="1192">古地図 / 投稿画面 / Unity</text>
  <text class="label" x="790" y="1276">目的</text>
  <text class="body" x="980" y="1276">卒業生の思い出を集める</text>

  <!-- Timeline -->
  <rect x="0" y="1420" width="1440" height="1960" fill="url(#grid)"/>
  <rect x="40" y="1470" width="1360" height="1830" fill="#f5f5f2" opacity=".94"/>
  <text class="label" x="80" y="1550">01 / ACTIVITY TIMELINE</text>
  <text class="h2" x="80" y="1625">4月から本番、その先まで</text>

  <!-- sticky calendar -->
  <rect class="panel" x="80" y="1695" width="330" height="870"/>
  <text class="label" x="108" y="1740">2026 / APR—JUL</text>
  <line class="thin" x1="80" y1="1765" x2="410" y2="1765"/>
  <text class="label" x="108" y="1810">APRIL</text>
  <g class="small">
    <text x="108" y="1845">M  T  W  T  F  S  S</text>
    <text x="108" y="1880">      01 02 03 04 05</text>
    <text x="108" y="1915">06 07 08 09 10 11 12</text>
    <text x="108" y="1950">13 14 ●15 16 17 18 19</text>
    <text x="108" y="1985">20 21 ●22 23 24 25 26</text>
    <text x="108" y="2020">27 28 ●29 30</text>
  </g>
  <text class="label" x="108" y="2080">MAY</text>
  <g class="small">
    <text x="108" y="2115">            01 ●02 03</text>
    <text x="108" y="2150">04 05 06 07 08 09 10</text>
    <text x="108" y="2185">11 12 ●13 14 15 16 17</text>
    <text x="108" y="2220">18 19 ●20 21 22 23 24</text>
    <text x="108" y="2255">25 26 ●27 28 29 30 31</text>
  </g>
  <text class="label" x="108" y="2315">JUNE</text>
  <g class="small">
    <text x="108" y="2350">01 ●02 03 ●04 05 06 07</text>
    <text x="108" y="2385">08 ●09 10 11 12 ●13 14</text>
    <text x="108" y="2420">●15 16 ◉17 18 19 ■20 21</text>
    <text x="108" y="2455">22 23 ●24 25 26 27 28</text>
  </g>
  <text class="label" x="108" y="2515">JULY</text>
  <text class="small" x="108" y="2550">●01 02 03 04 05 06 07 …</text>

  <!-- timeline rail -->
  <line class="line" x1="510" y1="1710" x2="510" y2="3205"/>

  <!-- active connector -->
  <circle cx="291" cy="2416" r="10" fill="#171717"/>
  <path class="line" d="M301 2416 H458 Q510 2416 510 2364 H560"/>
  <text class="note" x="108" y="2610">カレンダーはこの区間で固定</text>
  <text class="note" x="108" y="2635">現在の日付だけ線を表示</text>

  <!-- Entries -->
  <circle cx="510" cy="1760" r="7" fill="#fff" stroke="#171717" stroke-width="2"/>
  <text class="label" x="560" y="1748">04.15 / 活動</text>
  <text class="h3" x="560" y="1790">ゼミが始動</text>
  <text class="body" x="560" y="1828">共有場所を整え、HCDに向けた企画を始めた。</text>
  <line class="thin" x1="560" y1="1860" x2="1320" y2="1860"/>

  <circle cx="510" cy="1920" r="7" fill="#fff" stroke="#171717" stroke-width="2"/>
  <text class="label" x="560" y="1908">04.29 / 決定</text>
  <text class="h3" x="560" y="1950">アナログ班と技術班に分かれる</text>
  <text class="body" x="560" y="1988">古地図展示とデジタル表示を並行して作る。</text>
  <rect class="soft" x="1135" y="1892" width="185" height="110"/>
  <text class="small" x="1170" y="1950">議事メモ</text>

  <circle cx="510" cy="2100" r="7" fill="#fff" stroke="#171717" stroke-width="2"/>
  <text class="label" x="560" y="2088">05.27—28 / 苦労 → 決定</text>
  <text class="h3" x="560" y="2130">素材と担当をタスクリストで見える化</text>
  <text class="body" x="560" y="2168">作業が止まった理由を整理し、進め方を変えた。</text>
  <line class="thin" x1="560" y1="2200" x2="1320" y2="2200"/>

  <!-- key achievement card -->
  <circle cx="510" cy="2364" r="12" fill="#171717"/>
  <rect class="panel" x="560" y="2240" width="760" height="450"/>
  <text class="label" x="595" y="2285">06.17 / 苦労 + 達成 / TECHNICAL</text>
  <text class="h3" x="595" y="2330">投稿がUnityへリアルタイムに届く</text>
  <rect class="media" x="595" y="2360" width="410" height="280"/>
  <line class="thin" x1="595" y1="2360" x2="1005" y2="2640"/>
  <line class="thin" x1="1005" y1="2360" x2="595" y2="2640"/>
  <text class="small" x="730" y="2510">修正前後 / 動画</text>
  <text class="label" x="1040" y="2395">困ったこと</text>
  <text class="body" x="1040" y="2430">表示位置が合わない</text>
  <text class="label" x="1040" y="2490">原因</text>
  <text class="body" x="1040" y="2525">Unityの単位設定</text>
  <text class="label" x="1040" y="2585">できたこと</text>
  <text class="body" x="1040" y="2620">リアルタイム表示</text>

  <circle cx="510" cy="2805" r="12" fill="#171717"/>
  <text class="label" x="560" y="2750">06.20 / 本番</text>
  <text class="h3" x="560" y="2795">Home Coming Dayで展示</text>
  <rect class="media" x="560" y="2830" width="500" height="300"/>
  <line class="thin" x1="560" y1="2830" x2="1060" y2="3130"/>
  <line class="thin" x1="1060" y1="2830" x2="560" y2="3130"/>
  <rect class="media" x="1085" y="2830" width="235" height="142"/>
  <rect class="media" x="1085" y="2988" width="235" height="142"/>
  <text class="small" x="560" y="3165">会場全景を大きく、参加中の手元と投影画面を添える</text>
  <path class="dash" d="M510 3190 H1320"/>
  <text class="label" x="560" y="3240">06.24—07.23 / 振り返りと展開</text>
  <text class="body" x="560" y="3278">通常項目は短くまとめ、詳細は選択時に展開する。</text>

  <!-- Event chapter -->
  <rect class="media" x="0" y="3380" width="1440" height="720"/>
  <line class="thin" x1="0" y1="3380" x2="1440" y2="4100"/>
  <line class="thin" x1="1440" y1="3380" x2="0" y2="4100"/>
  <rect x="62" y="3450" width="370" height="116" fill="#fff"/>
  <text class="label" x="90" y="3490">02 / THE DAY</text>
  <text class="h3" x="90" y="3535">6月20日、本番</text>
  <g>
    <rect x="80" y="3920" width="230" height="100" fill="#fff"/>
    <rect x="330" y="3920" width="230" height="100" fill="#fff"/>
    <rect x="580" y="3920" width="230" height="100" fill="#fff"/>
    <rect x="830" y="3920" width="230" height="100" fill="#fff"/>
    <rect x="1080" y="3920" width="280" height="100" fill="#fff"/>
    <text class="label" x="105" y="3960">01 入場する</text>
    <text class="label" x="355" y="3960">02 古地図を見る</text>
    <text class="label" x="605" y="3960">03 付箋を書く</text>
    <text class="label" x="855" y="3960">04 撮影・確認</text>
    <text class="label" x="1105" y="3960">05 Unityに表示</text>
    <text class="small" x="105" y="3990">写真</text>
    <text class="small" x="355" y="3990">写真</text>
    <text class="small" x="605" y="3990">写真</text>
    <text class="small" x="855" y="3990">写真</text>
    <text class="small" x="1105" y="3990">動画</text>
  </g>

  <!-- Technical -->
  <rect class="paper" x="0" y="4100" width="1440" height="900"/>
  <text class="label" x="80" y="4190">03 / TECHNICAL NOTES</text>
  <text class="h2" x="80" y="4265">できるまでに、何があったか</text>
  <text class="body" x="80" y="4310">成果物ではなく、修正前後が分かる三つの記録に絞る。</text>

  <text class="label" x="80" y="4400">01 / OCR</text>
  <text class="h3" x="80" y="4440">付箋を撮影して確認する</text>
  <rect class="media" x="570" y="4360" width="230" height="170"/>
  <rect class="media" x="820" y="4360" width="230" height="170"/>
  <rect class="media" x="1070" y="4360" width="290" height="170"/>
  <path class="line" d="M800 4445 H820 M1050 4445 H1070"/>

  <line class="thin" x1="80" y1="4575" x2="1360" y2="4575"/>
  <text class="label" x="80" y="4650">02 / COORDINATE</text>
  <text class="h3" x="80" y="4690">ずれた場所を合わせる</text>
  <rect class="media" x="570" y="4610" width="375" height="230"/>
  <rect class="media" x="985" y="4610" width="375" height="230"/>
  <text class="small" x="710" y="4865">BEFORE</text>
  <text class="small" x="1125" y="4865">AFTER</text>

  <line class="thin" x1="80" y1="4910" x2="1360" y2="4910"/>
  <text class="label" x="80" y="4960">03 / REALTIME</text>
  <text class="h3" x="400" y="4960">投稿 → Supabase → Unity</text>

  <!-- Reflection / footer -->
  <rect x="0" y="5000" width="1440" height="360" fill="url(#grid)"/>
  <text class="label" x="80" y="5080">04 / REFLECTION</text>
  <text class="h2" x="80" y="5150">うまくいったこと。次に直すこと。</text>
  <rect class="panel" x="80" y="5200" width="600" height="105"/>
  <rect class="panel" x="760" y="5200" width="600" height="105"/>
  <text class="label" x="110" y="5240">うまくいった</text>
  <text class="body" x="110" y="5275">分担 / 入口展示 / システム稼働</text>
  <text class="label" x="790" y="5240">次に直す</text>
  <text class="body" x="790" y="5275">参加説明 / 進捗共有 / 背景説明</text>
  <rect class="ink" x="0" y="5360" width="1440" height="120"/>
  <text x="80" y="5428" font-family="Arial, sans-serif" font-size="18" fill="#fff">これから　　公開リポジトリ　　資料・クレジット</text>
</svg>
